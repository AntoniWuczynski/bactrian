name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-toolchains
      - name: Type-check the sandbox escape agents
        run: |
          pnpm --dir examples/agents/typescript exec tsc -p ../../../test/sandbox/tsconfig.json
          uv run --no-sync --project examples/agents/python mypy --strict test/sandbox/escape.py
          uv run --no-sync --project examples/agents/python pyright test/sandbox/escape.py
      - run: opam install . --deps-only --with-test --locked
      # The sandbox tests need bubblewrap and unprivileged user namespaces,
      # which Ubuntu's AppArmor restriction blocks by default. The clock tests
      # need libfaketime.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libfaketime
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          dpkg -L libfaketime | grep libfaketimeMT.so.1
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      # The virtual machine sandbox's tests need a container runtime. Ubuntu's
      # runner has Docker, so there they must run rather than skip.
      - run: opam exec -- dune build @acceptance
        env:
          BACTRIAN_REQUIRE_VM: ${{ runner.os == 'Linux' && '1' || '0' }}
  # The virtual machine sandbox's suite again on Podman, which Ubuntu's runner
  # ships (rootless, with the user's subordinate IDs set up below). Pinned to
  # 24.04, whose Podman 4.9.3 decision 0016 was checked against: ubuntu-latest
  # will move to a newer release, with a newer Podman.
  podman:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-toolchains
      - run: opam install . --deps-only --with-test --locked
      - name: Set up rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$USER"
          grep -q "^$USER:" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$USER"
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          podman --version
          podman info --format '{{.Host.Arch}} rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      - run: opam exec -- dune build @acceptance_vm
        env:
          BACTRIAN_VM_RUNTIME: podman
          BACTRIAN_REQUIRE_VM: "1"
  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: ocaml/setup-ocaml/lint-fmt@v3
  lint-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: ocaml/setup-ocaml/lint-doc@v3
  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - run: opam lint -W @1..99 bactrian.opam
