name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "10.7.0"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --frozen-lockfile --dir examples/agents/typescript
      - run: pnpm --dir examples/agents/typescript build
      - run: uv sync --locked --project examples/agents/python
      - name: Type-check the sandbox escape agents
        run: |
          pnpm --dir examples/agents/typescript exec tsc -p ../../../test/sandbox/tsconfig.json
          uv run --no-sync --project examples/agents/python mypy --strict test/sandbox/escape.py
          uv run --no-sync --project examples/agents/python pyright test/sandbox/escape.py
      - run: opam install . --deps-only --with-test --locked
      # The sandbox tests need bubblewrap and unprivileged user namespaces,
      # which Ubuntu's AppArmor restriction blocks by default.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - run: ALCOTEST_VERBOSE=1 opam exec -- dune build @acceptance
  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: ocaml/setup-ocaml/lint-fmt@v3
  lint-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: ocaml/setup-ocaml/lint-doc@v3
  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - run: opam lint -W @1..99 bactrian.opam
