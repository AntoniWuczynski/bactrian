name: release
on:
  push:
    # Main only builds, which keeps the opam-root cache warm for pull requests
    # and tags. Only a tag publishes.
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: read-all
env:
  # The tag on a release, a placeholder otherwise.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
  # Pinned by digest, so a release is built on the same base each time.
  ALPINE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
jobs:
  # A tag publishes only a commit on main whose CI run passed.
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # A tag pushed with its commit finds CI still running, so wait for the
      # newest CI run of the commit (up to ten minutes for it to appear).
      - name: Its CI run passed
        run: |
          for _ in $(seq 20); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run" ]; then break; fi
            sleep 30
          done
          if [ -z "$run" ]; then echo "no ci run for $GITHUB_SHA"; exit 1; fi
          gh run watch "$run" --exit-status --interval 60
          test "$(gh run view "$run" --json conclusion --jq .conclusion)" = success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            static: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            static: true
          - target: macos-arm64
            runner: macos-15
            static: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      # Linux: a static binary needs musl, so build in Alpine.
      # The opam root stays outside the checkout, as dune would read the dune
      # executable in it as a dune file.
      - if: matrix.static
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/opam-root
          key: opam-musl-${{ matrix.target }}-${{ hashFiles('bactrian.opam.locked', 'dev/release/build-static.sh') }}-${{ env.ALPINE }}
      - if: matrix.static
        run: |
          mkdir -p "$RUNNER_TEMP/opam-root"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/opam-root:/opam-root" -w /src \
            -e OPAMROOT=/opam-root "$ALPINE" sh dev/release/build-static.sh /src/bactrian
      # The container ran as root. Hand its files back to the runner user, who
      # saves the cache.
      - if: matrix.static
        run: sudo chown -R "$USER" bactrian "$RUNNER_TEMP/opam-root"
      # macOS: native, against the system libraries only.
      - if: ${{ !matrix.static }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - if: ${{ !matrix.static }}
        run: |
          opam install . --deps-only --locked
          opam exec -- dune build --profile release bin/main.exe
          cp _build/default/bin/main.exe bactrian
      - run: sh dev/release/package.sh bactrian "${{ matrix.target }}" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: bactrian-${{ matrix.target }}
          path: bactrian-*.tar.gz*
          if-no-files-found: error
  # A fresh runner image has no OCaml. Download the artefact and run it.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bactrian-${{ matrix.target }}
      # The sandbox check runs the binary's own bubblewrap path, which needs
      # bubblewrap and, on Ubuntu, the AppArmor restriction lifted (as in ci.yml).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: No OCaml on this runner
        run: "! command -v ocaml && ! command -v opam"
      - name: Check the checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
      - run: tar -xzf bactrian-*.tar.gz
      - run: ./bactrian-*/bactrian --version
      # The version is written in lib/core/version.ml, so a tag must match it.
      - name: The version is the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(./bactrian-*/bactrian --version)" = "${GITHUB_REF_NAME#v}"
      # doctor exits 0 whatever it finds, so read what it says about the sandbox.
      - name: The sandbox works
        run: |
          ./bactrian-*/bactrian doctor --json | tee doctor.json
          jq -e '.checks[] | select(.name == "sandbox") | .status == "ok"' doctor.json
      - name: Linux binaries are static
        if: runner.os == 'Linux'
        run: |
          file ./bactrian-*/bactrian
          # No program interpreter and no needed library. ldd is no test, as it
          # exits 0 for a static-pie binary.
          if readelf -lW ./bactrian-*/bactrian | grep INTERP; then exit 1; fi
          if readelf -dW ./bactrian-*/bactrian | grep NEEDED; then exit 1; fi
      - name: macOS binary links system libraries only
        if: runner.os == 'macOS'
        run: |
          file ./bactrian-*/bactrian | grep arm64
          otool -L ./bactrian-*/bactrian
          if otool -L ./bactrian-*/bactrian | tail -n +2 | grep -Ev '^\s+(/usr/lib/|/System/)'; then exit 1; fi
  # Only a tag push publishes, never a manual run.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bactrian-*
          merge-multiple: true
      - run: cat ./*.sha256 >SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tar.gz ./*.sha256 SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
