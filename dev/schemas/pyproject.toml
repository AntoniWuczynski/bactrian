[project]
name = "bactrian-schemas"
version = "0.0.0"
description = "Validates the files bactrian writes and reads against schemas/"
requires-python = ">=3.12"
dependencies = ["jsonschema", "pyyaml"]

[dependency-groups]
dev = ["mypy", "pyright", "types-jsonschema", "types-pyyaml"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.mypy]
strict = true
files = ["validate.py"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["validate.py"]
